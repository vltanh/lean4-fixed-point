status:
  scope: >-
    Formalized: Brouwer's fixed-point theorem for nonempty compact convex subsets of
    finite-dimensional real normed spaces (for maps continuous on the set, and for continuous maps
    C(s, s)); Brouwer's theorem for closed balls of finite-dimensional real inner product spaces;
    the no-retraction theorem for the closed unit ball of a finite-dimensional real inner product
    space; and, on the way, the same two theorems for maps that are C1 at every point of the closed
    unit ball, and Brouwer's theorem for convex hulls of finite sets in real normed spaces of any
    dimension. Kakutani's fixed-point theorem for set-valued maps with closed graph and nonempty
    convex values on nonempty compact convex subsets of finite-dimensional real normed spaces, for
    closed simplices (Kakutani's Theorem 1) and for compact convex subsets of finite-dimensional
    real inner product spaces (his Corollary), with the equivalence of a closed graph and Kakutani's
    sequential upper semicontinuity, proved by Kakutani's argument on iterated barycentric
    subdivisions of the standard simplex (with the continuity of piecewise-linear interpolation
    and the decay of the mesh) and again through a partition of unity. Schauder's fixed-point
    theorem for nonempty compact convex
    subsets of real normed spaces of any dimension, complete or not, and for nonempty closed convex
    subsets of real Banach spaces and maps with relatively compact image; Mazur's theorem on the
    compactness of closed convex hulls, used for the latter. The Challenge states Brouwer's theorem
    for compact convex sets and for closed balls, the no-retraction theorem, Kakutani's theorem and
    the two forms of Schauder's theorem. Not formalized: Milnor's hairy ball theorem; Brouwer's
    theorem for spaces that are only homeomorphic to a ball; Kakutani's Theorem 2 (von Neumann's
    intersection lemma) and Theorem 3 (the minimax theorem); Schauder's Satz III (weakly continuous
    maps in separable Banach spaces) and his Satz I beyond locally convex spaces (Schauder's
    problem, Scottish Book Problem 54); the extensions of
    Kakutani's and Schauder's theorems to locally convex spaces (Tychonoff, Fan, Glicksberg) and
    Kakutani's theorem in infinite-dimensional normed spaces (Bohnenblust and Karlin).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

