sources:
  - title: "Über Abbildung von Mannigfaltigkeiten"
    authors:
      - "L. E. J. Brouwer"
    id: "doi:10.1007/BF01456931"
    type: "paper"
    location: "Math. Ann. 71 (1911/1912), 97-115"
    relationship: "formalizes"
    note: >-
      Brouwer's fixed-point theorem in every finite dimension, proved there by topological
      methods. The formalization proves the theorem by the analytic route of Milnor and Rogers
      (next two sources), not by Brouwer's argument, and was not compared with this paper.
    author_endorsement: "n/a"
  - title: "Analytic proofs of the \"hairy ball theorem\" and the Brouwer fixed point theorem"
    authors:
      - "John Milnor"
    id: "doi:10.1080/00029890.1978.11994635"
    type: "paper"
    location: "Amer. Math. Monthly 85 (1978), 521-524 (JSTOR: doi:10.2307/2320860)"
    relationship: "other"
    note: >-
      Source of the method: analytic proofs of the hairy ball theorem and of Brouwer's theorem, in
      which the volume of the image of a region under a perturbation x + t v(x) of the identity is
      a polynomial in t. The formal proof follows the standard form of this argument for Brouwer's
      theorem (with Rogers's simplification, next source); the paper's text was not compared with
      the formalization line by line. The hairy ball theorem is not formalized.
    author_endorsement: "not-contacted"
  - title: "A less strange version of Milnor's proof of Brouwer's fixed-point theorem"
    authors:
      - "C. A. Rogers"
    id: "doi:10.1080/00029890.1980.11995082"
    type: "paper"
    location: "Amer. Math. Monthly 87 (1980), 525-527"
    relationship: "other"
    note: >-
      Source of the method: a simplification of Milnor's proof of Brouwer's theorem. The formal
      proof follows the standard form of the Milnor-Rogers argument, applied to a supposed C1
      retraction of the closed ball onto its sphere (docs/DETAILS.md, Method, step 1); the paper's
      text was not compared with the formalization line by line.
    author_endorsement: "n/a"
  - title: "A generalization of Brouwer's fixed point theorem"
    authors:
      - "Shizuo Kakutani"
    id: "doi:10.1215/S0012-7094-41-00838-4"
    type: "paper"
    location: "Duke Math. J. 8 (1941), 457-459"
    relationship: "formalizes"
    note: >-
      Kakutani's fixed-point theorem: Theorem 1 (closed simplices) and its Corollary (bounded closed
      convex sets of a Euclidean space), with his upper semicontinuity (closed graph). Proved by
      Kakutani's argument, with barycentric subdivisions of the standard simplex carried to other
      simplices by a linear map (fidelity); a second proof uses a partition of unity. Theorem 2 (von Neumann's lemma) and Theorem 3
      (the minimax theorem) are not formalized. Compared with a scan of the printed pages.
    author_endorsement: "n/a"
  - title: "Der Fixpunktsatz in Funktionalräumen"
    authors:
      - "Juliusz Schauder"
    id: "doi:10.4064/sm-2-1-171-180"
    type: "paper"
    location: "Studia Math. 2 (1930), 171-180"
    relationship: "formalizes"
    note: >-
      Schauder's fixed-point theorem: Satz I for compact convex sets, formalized for real normed
      spaces (Schauder states it for complete metric linear spaces, where his proof has a gap
      outside the locally convex case), and Satz II for closed convex sets of Banach spaces and
      maps with relatively compact image. Satz I is proved along Schauder's outline with a
      projection in place of his simplicial approximation, Satz II by Schauder's argument
      (fidelity). Satz III (weak continuity) is not formalized. Compared with a scan of the printed
      pages.
    author_endorsement: "n/a"
  - title: "Über die kleinste konvexe Menge, die eine gegebene kompakte Menge enthält"
    authors:
      - "Stanisław Mazur"
    id: "doi:10.4064/sm-2-1-7-9"
    type: "paper"
    location: "Studia Math. 2 (1930), 7-9"
    relationship: "other"
    note: >-
      Mazur's theorem, Schauder's Hilfssatz II: in a Banach space the closed convex hull of a
      compact set is compact. Formalized (Schauder.isCompact_closedConvexHull) from Mathlib's
      convex hulls of totally bounded sets, and used, as by Schauder, for Satz II.
    author_endorsement: "n/a"
  - title: "Change of variables in multiple integrals"
    authors:
      - "Peter D. Lax"
    id: "doi:10.1080/00029890.1999.12005078"
    type: "paper"
    location: "Amer. Math. Monthly 106 (1999), 497-501"
    relationship: "background"
    note: >-
      Obtains Brouwer's theorem as a corollary of a change of variables formula; context only,
      not followed by the formalization, which uses Mathlib's change of variables formula.
    author_endorsement: "not-contacted"

