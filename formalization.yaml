# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The fixed-point theorems of Brouwer, Kakutani and Schauder, with an analytic proof of Brouwer's theorem"
  description: >-
    A Lean 4 / Mathlib proof of Brouwer's fixed-point theorem in every finite dimension: a
    continuous map of a nonempty compact convex subset of a finite-dimensional real normed space
    into itself has a fixed point. Also proved: the same for closed balls of a finite-dimensional
    real inner product space, and the no-retraction theorem, that the unit sphere of such a space
    is not a retract of its closed unit ball.


    The proof is analytic, along the lines of Milnor (1978) and Rogers (1980), and uses no
    homology, degree theory or simplicial approximation. A C1 retraction r of the closed unit ball
    onto its sphere is ruled out with the change of variables formula: for small t > 0 the map
    x + t(r(x) - x) sends the open ball bijectively onto itself with positive Jacobian determinant,
    so the integral of that determinant over the ball, a polynomial in t, equals the volume of the
    ball for every t, whereas at t = 1 it vanishes. Brouwer's theorem follows for C1 self-maps of
    the ball by the ray construction, for continuous ones by smoothing by convolution, and for
    compact convex sets through the nearest-point retraction. Brouwer's theorem has earlier formal
    proofs in HOL Light, Isabelle/HOL and Mizar, in Coq for the plane, in Lean 3 through singular
    homology, and in Lean 4 for the plane and for the standard simplex; this proof is independent
    of them.


    Kakutani's fixed-point theorem (1941) and Schauder's fixed-point theorem (1930) are derived from
    Brouwer's. Kakutani's: a set-valued map of a nonempty compact convex subset of a
    finite-dimensional real normed space, with closed graph and nonempty convex values, has a point
    x in its own value at x; it is proved by Kakutani's argument (piecewise-linear approximations on
    barycentric subdivisions of a simplex, Brouwer, a limit along a subsequence, then a retraction
    for general compact convex sets), and a second time through a partition of unity.
    Schauder's: a continuous self-map of a nonempty compact convex subset of a real normed space of
    any dimension has a fixed point, and so does a continuous self-map of a nonempty closed convex
    subset of a real Banach space with relatively compact image; it is proved through Schauder's
    projection onto the convex hull of a finite epsilon-net, Brouwer's theorem in its
    finite-dimensional span, and Mazur's theorem for the second form.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

