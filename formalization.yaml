fidelity:
  divergences: >-
    Statements: none known. The Challenge states Brouwer's theorem in its standard form, for
    nonempty compact convex subsets of a finite-dimensional real normed space (equivalently of
    R^n, for every n >= 0 and every norm), a continuous self-map being a total function that is
    continuous on the set and maps it into itself. The closed-ball theorem and the no-retraction
    theorem are stated for finite-dimensional real inner product spaces, which are R^n with the
    Euclidean norm up to a linear isometry; in dimension 0 the no-retraction theorem holds because
    the sphere is empty. Proofs: Brouwer's own proof is not followed. The proof is the analytic
    argument of Milnor and Rogers in its standard form (no C1 retraction, by the change of
    variables formula and a polynomial identity in t), followed by the ray construction for C1
    maps, smoothing by convolution for continuous maps, an affine change of variables for other
    balls, and the nearest-point retraction for compact convex sets, after a linear isomorphism
    with EuclideanSpace R (Fin n). The polynomial dependence of det(1 + tA) on t is obtained by
    Lagrange interpolation through t = 0, 1, ..., dim E. The papers' texts were not compared with
    the formalization line by line.


    Kakutani. Statements: the Challenge states Kakutani's theorem for nonempty compact convex
    subsets of a finite-dimensional real normed space, Kakutani's Euclidean spaces up to a linear
    isomorphism; Kakutani's upper semicontinuity is stated as a closed graph over the set, which
    for closed sets is equivalent to his sequential definition (Kakutani.isClosed_graph_iff_seq),
    and the values are required nonempty and convex (closed values follow from the closed graph).
    Kakutani's Theorem 1 is proved for convex hulls of nonempty finite sets, closed simplices being
    a special case also stated. Proofs: Kakutani's Theorem 1
    does not state that the values are nonempty, but his proof needs it and the theorem fails
    without it; the formalization requires it, as his Theorem 2 does. Theorem 1 is proved by
    Kakutani's argument, including his approximation by maps that are linear on the simplices of
    the n-th barycentric subdivision (built in FixedPoint/Simplex/Subdivision.lean, with the
    continuity of the piecewise-linear maps and the decay of the mesh). The subdivisions are built
    on the standard simplex and carried to any other simplex, or convex hull of finitely many
    points, by the linear map u -> sum u_k v_k, where Kakutani subdivides the simplex itself; one
    subsequence serves where Kakutani takes them one after the other. For the Corollary, Kakutani
    encloses the set in a simplex, the formalization in the convex hull of a finite set (the image
    of a simplex), and uses the nearest-point retraction, which Kakutani leaves unspecified. A
    second proof (Kakutani.PartitionOfUnity.exists_fixedPoint) replaces the subdivisions by the
    partition of unity of Schauder's projection and Caratheodory's theorem.


    Schauder. Statements: Schauder states Satz I for complete metric linear spaces (Banach's
    axioms), not necessarily locally convex; his proof uses that convex combinations of nearby
    points stay nearby (Hilfssatz I), which holds in normed and locally convex spaces only, and the
    general case became Schauder's problem (Scottish Book Problem 54; R. Cauty's claimed solution,
    Fund. Math. 170 (2001), has a gap). The formalization states Satz I for real normed spaces,
    complete or not, where Schauder's argument is valid. Satz II is stated as Schauder does, for
    real Banach spaces and closed convex sets H with F(H) relatively compact (Schauder's
    "kompakt"). Proofs: Satz II is proved as Schauder does, by Mazur's theorem (Schauder's
    Hilfssatz II) and Satz I. For Satz I the formalization follows Schauder's outline (a finite
    epsilon-net, Brouwer's theorem on its convex hull, a point moved by little, compactness) with
    one departure: Schauder triangulates the convex hull of the net and approximates F by a
    simplicial map sending each vertex d to a point of the net within epsilon of F(d), while the
    formalization composes F with the projection onto the hull given by the partition of unity
    max(0, epsilon - |x - c|), the Schauder projection of later expositions, which is not in the
    paper. Reason: Mathlib has no triangulations of polytopes or simplicial approximation.
    Brouwer's theorem on the hull is applied in the finite-dimensional span of the net.

review:
  status: "unchecked"
  reviewers:
    - "none"
  notes: >-
    No person has reviewed the statements or the proofs. A separate Claude agent reviewed the
    statements and proofs of Kakutani's and Schauder's theorems against the theorems' standard
    forms and Kakutani's paper; its findings were addressed. Lean's kernel checks the proofs, and
    Comparator, with Lean's kernel and the NanoDa kernel, checks that FixedPointSolution.lean proves
    the statements of FixedPointChallenge.lean using only propext, Classical.choice and Quot.sound.

alignment:
  namespace: "FixedPointChallenge"
  statements:
    - source: "Brouwer's fixed-point theorem (Brouwer 1911/1912)"
      lean: "FixedPointChallenge.brouwer"
      module: "FixedPointChallenge"
      status: "proved"
      note: >-
        Every map of a nonempty compact convex subset s of a finite-dimensional real normed space
        into itself that is continuous on s has a fixed point in s.
    - source: "Brouwer's fixed-point theorem for closed balls"
      lean: "FixedPointChallenge.brouwer_closedBall"
      module: "FixedPointChallenge"
      status: "proved"
      note: >-
        Every map of a closed ball closedBall c R, R >= 0, of a finite-dimensional real inner
        product space into itself that is continuous on the ball has a fixed point in it.
    - source: "The no-retraction theorem (equivalent to Brouwer's theorem)"
      lean: "FixedPointChallenge.no_retraction"
      module: "FixedPointChallenge"
      status: "proved"
      note: >-
        No map of a finite-dimensional real inner product space is continuous on the closed unit
        ball, maps it into the unit sphere and fixes every point of the sphere.
    - source: "Kakutani's fixed-point theorem (Kakutani 1941, Theorem 1 and Corollary)"
      lean: "FixedPointChallenge.kakutani"
      module: "FixedPointChallenge"
      status: "proved"
      note: >-
        If a set-valued map sends each point of a nonempty compact convex subset s of a
        finite-dimensional real normed space to a nonempty convex subset of s, and its graph over s
        is closed, then some point x of s lies in its own value at x.
    - source: "Schauder's fixed-point theorem (Schauder 1930), for compact convex sets"
      lean: "FixedPointChallenge.schauder"
      module: "FixedPointChallenge"
      status: "proved"
      note: >-
        Every map of a nonempty compact convex subset s of a real normed space, of any dimension,
        into itself that is continuous on s has a fixed point in s.
    - source: "Schauder's fixed-point theorem (Schauder 1930), for maps with relatively compact image"
      lean: "FixedPointChallenge.schauder_of_isCompact_closure_image"
      module: "FixedPointChallenge"
      status: "proved"
      note: >-
        Every map of a nonempty closed convex subset s of a real Banach space into itself that is
        continuous on s and has a relatively compact image f(s) has a fixed point in s.

acknowledgements: >-
  Mathlib (among others its change of variables formula, inverse function theorem for Lipschitz
  perturbations of the identity, smoothing by convolution, nearest points in convex sets,
  Caratheodory's theorem and the convex hulls of totally bounded sets) and
