name = "FixedPoint"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FixedPoint", "FixedPointChallenge", "FixedPointSolution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "FixedPoint"
globs = ["FixedPoint.*"]

[[lean_lib]]
name = "FixedPointChallenge"

[[lean_lib]]
name = "FixedPointSolution"
